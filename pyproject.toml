[project]
name = "sibyl"
version = "0.1.0"
description = "Reconcile fragmented public vulnerability sources against a company's SBOM."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "packageurl-python>=0.16",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "univers>=30.11",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sibyl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
