services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: sibyl
      POSTGRES_PASSWORD: sibyl
      POSTGRES_DB: sibyl
    volumes:
      - sibyl_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sibyl -d sibyl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sibyl_pg:
